<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小幫手話術台｜客服快速回覆工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F8;
    --surface:#FFFFFF;
    --surface-alt:#FBFBFD;
    --ink:#1C1D21;
    --ink-soft:#6B6E76;
    --ink-faint:#9AA0AC;
    --line:#E5E7EC;
    --line-soft:#EEF0F3;
    --shopee:#EE4D2D;
    --shopee-deep:#C93E20;
    --shopee-soft:#FDECE7;
    --teal:#0E7C7B;
    --teal-soft:#E4F4F2;
    --amber:#B5720C;
    --amber-soft:#FBF0DC;
    --plum:#79479A;
    --plum-soft:#F1E9F6;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-card:0 1px 2px rgba(28,29,33,.04), 0 1px 1px rgba(28,29,33,.03);
    --shadow-pop:0 12px 32px rgba(28,29,33,.14), 0 2px 8px rgba(28,29,33,.08);
    --font-display:'Noto Sans TC',system-ui,sans-serif;
    --font-body:'Noto Sans TC',system-ui,sans-serif;
    --font-mono:'Space Grotesk','Noto Sans TC',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--shopee-soft);color:var(--shopee-deep);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0;}

  /* ---------- Header ---------- */
  .app-header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:16px 22px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:30;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(155deg,var(--shopee),var(--shopee-deep));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 4px 10px rgba(238,77,45,.28);
  }
  .brand-mark .icon{stroke:#fff;width:20px;height:20px;stroke-width:2;}
  .brand-text{min-width:0;}
  .brand-text h1{
    font-size:16px;font-weight:800;margin:0;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .brand-text p{
    margin:1px 0 0;font-size:11.5px;color:var(--ink-soft);font-weight:500;
    white-space:nowrap;
  }
  .header-search{
    flex:1;max-width:420px;
    display:flex;align-items:center;gap:8px;
    background:var(--surface-alt);border:1px solid var(--line);
    border-radius:999px;padding:8px 14px;
    transition:border-color .15s;
  }
  .header-search:focus-within{border-color:var(--shopee);}
  .header-search .icon{color:var(--ink-faint);}
  .header-search input{
    border:none;background:transparent;outline:none;
    font-size:13.5px;width:100%;color:var(--ink);
  }
  .header-search input::placeholder{color:var(--ink-faint);}
  .header-stat{
    font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);
    white-space:nowrap;font-weight:600;
  }
  .header-stat b{color:var(--shopee-deep);font-weight:700;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border:none;border-radius:999px;
    font-weight:700;font-size:13px;
    padding:9px 16px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--shopee);color:#fff;box-shadow:0 4px 10px rgba(238,77,45,.25);}
  .btn-primary:hover{background:var(--shopee-deep);}
  .btn-ghost{background:var(--surface-alt);color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--line-soft);}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn-icon{padding:8px;border-radius:10px;}

  /* ---------- Layout ---------- */
  .layout{
    display:grid;grid-template-columns:360px 1fr;
    height:calc(100vh - 71px);
  }
  @media (max-width:880px){
    .layout{grid-template-columns:1fr;height:auto;}
    .sidebar{height:auto;border-right:none;border-bottom:1px solid var(--line);}
    .main{height:auto;}
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    background:var(--surface);
    overflow:hidden;
  }
  .filter-block{padding:14px 16px 10px;border-bottom:1px solid var(--line-soft);}
  .mode-tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;}
  .mode-tab{
    flex:1;background:var(--surface-alt);border:none;border-bottom:2px solid transparent;
    padding:12px 8px;font-size:12.5px;font-weight:700;color:var(--ink-faint);
  }
  .mode-tab.active{color:var(--shopee-deep);border-bottom-color:var(--shopee);background:var(--surface);}
  .mode-panel{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
  #browsePanel{overflow:hidden;}

  .wiz-step{padding:14px 16px;border-bottom:1px solid var(--line-soft);}
  .wiz-step-head{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;
    color:var(--ink);margin-bottom:10px;
  }
  .step-num{
    width:19px;height:19px;border-radius:50%;background:var(--ink);color:#fff;
    font-family:var(--font-mono);font-size:10.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .step-optional{
    font-size:10px;font-weight:700;color:var(--ink-faint);background:var(--line-soft);
    padding:2px 7px;border-radius:999px;margin-left:auto;
  }
  .wiz-sub-label{font-size:11px;color:var(--ink-faint);margin:6px 0 6px;font-weight:600;}
  .wiz-btns{display:flex;flex-wrap:wrap;gap:7px;}
  .wiz-btn{
    display:inline-flex;align-items:center;gap:5px;
    border:1px solid var(--line);background:var(--surface);
    border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--ink);
    transition:all .12s;
  }
  .wiz-btn:hover{border-color:var(--shopee);background:var(--shopee-soft);color:var(--shopee-deep);}
  .wiz-btn.active{background:var(--shopee);border-color:var(--shopee);color:#fff;}
  .wiz-chip{
    border:1px solid var(--line);background:var(--surface-alt);color:var(--ink-soft);
    border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;
  }
  .wiz-chip:hover{border-color:var(--ink-faint);}
  .wiz-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .wiz-link{
    color:inherit;opacity:.7;text-decoration:none;font-size:11px;
  }
  .wiz-link:hover{opacity:1;}
  .empty-note{font-size:11.5px;color:var(--ink-faint);}
  #saleTypePre.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  #saleTypePost.active{background:var(--shopee);color:#fff;border-color:var(--shopee);}

  .action-hints{
    flex-shrink:0;max-height:220px;overflow-y:auto;
    padding:12px 16px;border-top:1px solid var(--line);
    background:var(--amber-soft);
  }
  .hint-card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;margin-bottom:8px;
  }
  .hint-card:last-child{margin-bottom:0;}
  .hint-title{font-size:11.5px;font-weight:800;color:var(--ink);margin:0 0 3px;}
  .hint-text{font-size:12px;color:var(--ink-soft);line-height:1.6;margin:0 0 6px;}
  .hint-link{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    color:var(--shopee-deep);text-decoration:none;word-break:break-all;
  }
  .hint-link:hover{text-decoration:underline;}
  .filter-label{
    font-family:var(--font-mono);font-size:10.5px;font-weight:600;
    letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;
    margin:0 0 8px;
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    border:1px solid var(--line);background:var(--surface-alt);
    color:var(--ink-soft);font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:999px;transition:all .12s;
  }
  .chip:hover{border-color:var(--ink-faint);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip.stage-open.active{background:var(--teal);border-color:var(--teal);}
  .chip.stage-wait.active{background:var(--amber);border-color:var(--amber);}
  .chip.stage-close.active{background:var(--plum);border-color:var(--plum);}
  .chip.stage-body.active{background:var(--shopee);border-color:var(--shopee);}
  .sub-filters{padding-top:10px;margin-top:10px;border-top:1px dashed var(--line);}

  .list-scroll{flex:1;overflow-y:auto;padding:12px 14px 90px;}
  .tpl-card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:12px 12px 10px;
    margin-bottom:10px;box-shadow:var(--shadow-card);
    transition:border-color .12s;
  }
  .tpl-card:hover{border-color:var(--ink-faint);}
  .tpl-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .tpl-badges{display:flex;gap:5px;flex-wrap:wrap;}
  .badge{
    font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:999px;
    font-family:var(--font-mono);letter-spacing:.02em;
  }
  .badge-open{background:var(--teal-soft);color:var(--teal);}
  .badge-wait{background:var(--amber-soft);color:var(--amber);}
  .badge-close{background:var(--plum-soft);color:var(--plum);}
  .badge-cat{background:var(--shopee-soft);color:var(--shopee-deep);}
  .tpl-title{font-size:13.5px;font-weight:700;margin:0 0 4px;color:var(--ink);}
  .tpl-preview{
    font-size:12.5px;line-height:1.6;color:var(--ink-soft);
    margin:0 0 10px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tpl-actions{display:flex;align-items:center;gap:6px;}
  .tpl-actions .btn{flex:1;justify-content:center;}
  .icon-btn{
    border:1px solid var(--line);background:var(--surface-alt);color:var(--ink-soft);
    border-radius:8px;padding:7px;display:flex;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--ink-faint);}
  .empty-hint{
    text-align:center;color:var(--ink-faint);font-size:12.5px;
    padding:40px 20px;line-height:1.8;
  }

  .sidebar-footer{
    padding:10px 16px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface);
  }
  .link-btn{
    background:none;border:none;color:var(--ink-faint);
    font-size:11.5px;font-weight:600;text-decoration:underline;
    text-underline-offset:2px;padding:4px;
  }
  .link-btn:hover{color:var(--ink-soft);}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;overflow:hidden;}
  .quickbar{
    background:var(--surface-alt);border-bottom:1px solid var(--line);
    padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .quick-field{display:flex;align-items:center;gap:0;}
  .quick-field label{
    font-size:12px;font-weight:700;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-right:none;
    padding:7px 10px;border-radius:9px 0 0 9px;white-space:nowrap;
  }
  .quick-field input{
    border:1px solid var(--line);border-radius:0 9px 9px 0;
    padding:7px 12px;font-size:13px;outline:none;width:240px;color:var(--ink);
    background:var(--surface);
  }
  .quick-field input:focus{border-color:var(--shopee);}
  #btnCalc{margin-left:auto;}

  /* ---- Logistics calculator ---- */
  .calc-plans{display:flex;flex-direction:column;gap:10px;}
  .calc-plan{
    border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;
    border-left:4px solid var(--plan-color, var(--ink-faint));
  }
  .calc-plan-head{
    padding:9px 12px 6px;font-size:13px;font-weight:800;color:var(--ink);
    background:var(--surface-alt);
  }
  .calc-plan-area{padding:0 12px 10px;font-size:11px;color:var(--ink-faint);line-height:1.6;}
  .calc-plan-rows{display:flex;flex-direction:column;gap:6px;padding:0 12px 10px;}
  .calc-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--line);background:var(--surface);
    border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--ink-soft);
    font-weight:600;text-align:left;transition:all .12s;
  }
  .calc-row:hover{border-color:var(--ink-faint);}
  .calc-row .calc-result{font-weight:800;color:var(--ink);}
  .calc-row.active{background:var(--shopee-soft);border-color:var(--shopee);color:var(--shopee-deep);}
  .calc-row.active .calc-result{color:var(--shopee-deep);}
  .calc-date-field{margin-top:16px;}
  
  .var-bar{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  }
  .var-bar.is-empty{display:none;}
  .var-bar-label{
    font-family:var(--font-mono);font-size:10.5px;font-weight:700;
    color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;
    margin-right:2px;
  }
  .var-field{display:flex;align-items:center;gap:6px;}
  .var-field label{
    font-size:12px;font-weight:700;color:var(--shopee-deep);
    background:var(--shopee-soft);padding:5px 8px 5px 10px;border-radius:8px 0 0 8px;
    white-space:nowrap;
  }
  .var-field input{
    border:1px solid var(--line);border-left:none;
    border-radius:0 8px 8px 0;padding:5px 10px;font-size:12.5px;
    width:130px;outline:none;
  }
  .var-field input:focus{border-color:var(--shopee);}

  .compose-scroll{flex:1;overflow-y:auto;padding:26px 24px 40px;}
  .compose-inner{max-width:640px;margin:0 auto;}
  .compose-empty{
    text-align:center;color:var(--ink-faint);padding:70px 20px;
  }
  .compose-empty .icon{width:34px;height:34px;margin:0 auto 14px;color:var(--line);}
  .compose-empty p{font-size:13.5px;line-height:1.8;margin:0;}

  .bubble-row{display:flex;gap:10px;margin-bottom:6px;position:relative;}
  .bubble-row + .bubble-row{margin-top:18px;}
  .avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(155deg,#3B82C4,#2C63A8);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 5px rgba(44,99,168,.3);
  }
  .avatar .icon{width:15px;height:15px;stroke:#fff;stroke-width:2.2;}
  .bubble-col{flex:1;min-width:0;}
  .bubble-meta{
    display:flex;align-items:center;gap:8px;margin-bottom:5px;
  }
  .bubble-name{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .bubble-stage-tag{font-size:10px;font-weight:700;color:var(--ink-faint);font-family:var(--font-mono);}
  .bubble-box{
    background:var(--surface);border:1px solid var(--line);
    border-radius:4px 16px 16px 16px;
    padding:13px 15px;font-size:13.5px;line-height:1.75;
    color:var(--ink);white-space:pre-wrap;word-break:break-word;
    box-shadow:var(--shadow-card);
  }
  .bubble-box mark{
    background:var(--shopee-soft);color:var(--shopee-deep);
    padding:0 3px;border-radius:4px;font-weight:700;font-style:normal;
  }
  .bubble-toolbar{
    display:flex;gap:6px;margin-top:6px;
    opacity:0;transition:opacity .12s;
  }
  .bubble-row:hover .bubble-toolbar{opacity:1;}
  .bubble-toolbar button{
    font-size:11px;font-weight:600;color:var(--ink-soft);
    background:var(--surface-alt);border:1px solid var(--line);
    border-radius:7px;padding:4px 9px;display:inline-flex;align-items:center;gap:4px;
  }
  .bubble-toolbar button:hover{background:var(--line-soft);color:var(--ink);}
  .bubble-toolbar button.danger:hover{color:var(--shopee-deep);border-color:var(--shopee-soft);}

  .compose-actions{
    display:flex;gap:10px;justify-content:center;margin-top:28px;
    padding-top:20px;border-top:1px dashed var(--line);
  }

  /* ---------- Toast ---------- */
  #toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-pop);
    display:flex;align-items:center;gap:8px;
    animation:toast-in .18s ease;
  }
  .toast.warn{background:var(--amber);}
  .toast .icon{width:15px;height:15px;stroke:#fff;}
  @keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(28,29,33,.45);
    display:flex;align-items:center;justify-content:center;z-index:90;
    padding:20px;backdrop-filter:blur(2px);
  }
  .modal{
    background:var(--surface);border-radius:var(--radius-lg);
    width:100%;max-width:480px;box-shadow:var(--shadow-pop);
    max-height:88vh;overflow-y:auto;
  }
  .modal-head{
    padding:18px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-head h3{margin:0;font-size:15.5px;font-weight:800;}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .field label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .field select,.field input[type=text],.field textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:13.5px;outline:none;color:var(--ink);
    background:var(--surface-alt);
  }
  .field select:focus,.field input:focus,.field textarea:focus{border-color:var(--shopee);background:var(--surface);}
  .field textarea{min-height:110px;resize:vertical;line-height:1.6;}
  .field-hint{font-size:11px;color:var(--ink-faint);margin-top:5px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-foot{
    padding:16px 22px;border-top:1px solid var(--line);
    display:flex;justify-content:flex-end;gap:10px;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 8l8-5 8 5M4 8v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M4 8l2 12M20 8l-2 12M9 12a3 3 0 0 0 6 0"/></svg>
    </div>
    <div class="brand-text">
      <h1>小幫手話術台</h1>
      <p>客服快速回覆組合工具</p>
    </div>
  </div>
  <div class="header-search">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="搜尋話術標題或內文…">
  </div>
  <div class="header-stat">共 <b id="statCount">0</b> 則話術</div>
  <button class="btn btn-ghost btn-sm" id="btnExport">⬇️ 匯出</button>
  <button class="btn btn-ghost" id="btnImport">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    匯入 Excel
  </button>
  <input type="file" id="fileImport" accept=".xlsx,.xls,.csv" style="display:none;">
  <button class="btn btn-primary" id="btnAdd">
    <svg class="icon" viewBox="0 0 24 24" style="stroke:#fff;width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg>
    新增話術
  </button>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="mode-tabs">

/* ============ Excel import ============ */
const IMPORT_HEADER_ALIASES = {
  stage:['階段','stage','對話階段'],
  category:['類型','分類','問題類型','category'],
  saletype:['售前售後','售前/售後','情境','saletype'],
  title:['標題','title','名稱'],
  content:['內容','回覆','話術','content'],
  variants:['其他回覆方式','其他版本','變體','variants'],
  hint:['提示','建議動作','動作','hint'],
  link:['連結','link','網址']
};
const VARIANT_DELIM = /\n?===\n?/;
function stageFromText(s){
  s = (s==null? '' : String(s)).trim();
  if(/開頭/.test(s)) return 'open';
  if(/結尾|结尾/.test(s)) return 'close';
  if(/查詢|等待|時間/.test(s)) return 'wait';
  if(/中段|回答|body/i.test(s)) return 'body';
  return null;
}
function saleTypeFromText(s){
  s = (s==null? '' : String(s)).trim();
  if(/皆可|通用|都可/.test(s)) return 'both';
  if(/售前/.test(s)) return 'pre';
  if(/售後|售后/.test(s)) return 'post';
  return null;
}
function findCol(rowKeys, aliases){
  return rowKeys.find(k => aliases.some(a => String(k).toLowerCase().includes(a.toLowerCase())));
}
/* 依文字比對現有類型;找不到就在 workingCats 裡建立一個新的,讓匯入過程可以自動新增大項 */
function resolveCategory(text, workingCats){
  const label = (text==null? '' : String(text)).trim();
  if(!label) return null;
  let found = workingCats.find(c => c.label===label || label.includes(c.label) || c.label.includes(label));
  if(found) return found;
  const created = {id:'c'+Date.now()+'_'+Math.random().toString(36).slice(2,5), label, emoji:'🏷️'};
  workingCats.push(created);
  return created;
}
function importFromRows(rows){
  const keys = Object.keys(rows[0] || {});
  const col = {
    stage: findCol(keys, IMPORT_HEADER_ALIASES.stage),
    category: findCol(keys, IMPORT_HEADER_ALIASES.category),
    saletype: findCol(keys, IMPORT_HEADER_ALIASES.saletype),
    title: findCol(keys, IMPORT_HEADER_ALIASES.title),
    content: findCol(keys, IMPORT_HEADER_ALIASES.content),
    variants: findCol(keys, IMPORT_HEADER_ALIASES.variants),
    hint: findCol(keys, IMPORT_HEADER_ALIASES.hint),
    link: findCol(keys, IMPORT_HEADER_ALIASES.link)
  };
  if(!col.title || !col.content){
    return {error:'找不到「標題」或「回覆內容」欄位,請確認 Excel 欄位名稱,或先下載範本參考格式。'};
  }
  const workingCats = categories.map(c=>({...c}));
  const valid = []; let skipped = 0;
  rows.forEach((r,i)=>{
    const title = String(r[col.title] ?? '').trim();
    const content = String(r[col.content] ?? '').trim();
    if(!title || !content){ skipped++; return; }
    const stage = (col.stage ? stageFromText(r[col.stage]) : null) || 'body';
    let category = null;
    if(stage==='body'){
      const catText = col.category ? String(r[col.category] ?? '').trim() : '';
      const resolved = resolveCategory(catText, workingCats) || workingCats.find(c=>c.label==='其他') || workingCats[0];
      category = resolved ? resolved.id : null;
    }
    let saleType = null;
    if(stage==='open' || stage==='close' || stage==='body'){
      const raw = col.saletype ? saleTypeFromText(r[col.saletype]) : null;
      saleType = raw || (stage==='body' ? 'both' : 'post');
    }
    const variantsRaw = col.variants ? String(r[col.variants] ?? '').trim() : '';
    const variants = variantsRaw ? variantsRaw.split(VARIANT_DELIM).map(v=>v.trim()).filter(Boolean) : [];
    const hint = col.hint ? String(r[col.hint] ?? '').trim() : '';
    const link = col.link ? String(r[col.link] ?? '').trim() : '';
    valid.push({id:'x'+Date.now()+'_'+i+Math.random().toString(36).slice(2,5), stage, category, saleType, title, content, variants, hint: hint || undefined, link: link || undefined});
  });
  const existingIds = new Set(categories.map(c=>c.id));
  const newCategories = workingCats.filter(c=>!existingIds.has(c.id));
  return {valid, skipped, newCategories};
}

function openImportConfirmModal(result, filename){

  result.valid.forEach(t=> counts[t.stage]++);

  overlay.innerHTML = `

function exportCurrentTemplates(){
  if(typeof XLSX==='undefined'){ showToast('匯出功能載入中,請稍後再試一次', true); return; }
  if(!templates.length){ showToast('目前沒有話術可以匯出', true); return; }
  const saleTypeLabel = {pre:'售前', post:'售後', both:'皆可'};
  const rows = templates.map(t=>({
    '階段': STAGE_LABEL_SHORT[t.stage] || t.stage,
    '售前售後': t.saleType ? (saleTypeLabel[t.saleType]||'') : '',
    '類型': t.category ? catLabel(t.category) : '',
    '標題': t.title,
    '回覆內容': t.content,
    '其他回覆方式': (t.variants && t.variants.length) ? t.variants.join('\n===\n') : '',
    '提示': t.hint || '',
    '參考連結': t.link || ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '話術清單');
  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `客服話術匯出_${dateStr}.xlsx`);
}

/* ============ State ============ */
let templates = [];
let composeList = []; // [{instId, tplId}]
let varsValues = {};
let activeStage = 'all';
let activeCategory = 'all';
let searchTerm = '';
let editingId = null;

/* ============ Storage ============ */
async function loadTemplates(){
  try{
    const res = localStorage.getItem(STORAGE_KEY);
    if(res){
      const parsed = JSON.parse(res);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch(e){ console.error(e); }
  await saveTemplates(SEED_TEMPLATES);
  return SEED_TEMPLATES.slice();
}
async function saveTemplates(list){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
  catch(e){ console.error('儲存失敗', e); showToast('儲存失敗,請稍後再試', true); }
}

/* ============ Utils ============ */
function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function extractVars(text){
  const re = /\{([^{}]+)\}/g; const out = []; let m;
  while((m = re.exec(text))){ if(!out.includes(m[1])) out.push(m[1]); }
  return out;
}
function fillPlain(text){
  return text.replace(/\{([^{}]+)\}/g, (m,p1) => (varsValues[p1] && varsValues[p1].trim()) ? varsValues[p1] : m);
}
function fillHtml(text){
  const escaped = escapeHtml(text);
  return escaped.replace(/\{([^{}]+)\}/g, (m,p1) => {
    const v = varsValues[p1];
    return (v && v.trim()) ? escapeHtml(v) : `<mark>${escapeHtml(m)}</mark>`;
  });
}
function allVariants(t){
  return [t.content, ...(t.variants||[])].filter(v=>v!=null);
}
function instanceText(t, variantIndex){
  const arr = allVariants(t);
  return arr[variantIndex] ?? arr[0] ?? '';
}
function showToast(msg, warn=false){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.innerHTML = (warn ? icon('alert') : icon('check')) + `<span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2000);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}

function setSidebarMode(mode){
  sidebarMode = mode;
  document.querySelectorAll('.mode-tab').forEach(b=> b.classList.toggle('active', b.dataset.mode===mode));
  document.getElementById('wizardPanel').style.display = mode==='wizard' ? 'flex' : 'none';

    ? '點按鈕就會依順序組進右邊的回覆'
    : '點卡片上「加入回覆」即可組合回覆';
}
function linkTag(t){
  if(!t.link && !t.hint) return '';
  const title = t.hint ? escapeHtml(t.hint) : '查看說明連結';
  if(t.link){
    return `<a class="wiz-link" href="${escapeHtml(t.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="${title}">💡</a>`;
  }
  return `<span class="wiz-link" title="${title}">💡</span>`;
}
function renderActionHints(){
  const box = document.getElementById('actionHints');
  const relevant = composeList
    .map(c=>templates.find(t=>t.id===c.tplId))
    .filter(t=> t && (t.hint || t.link));

  box.style.display='block';
  box.innerHTML = `<p class="filter-label" style="margin-bottom:8px;">💡 建議動作</p>` + relevant.map(t=>`
    <div class="hint-card">
      <p class="hint-title">${escapeHtml(t.title)}</p>
      ${t.hint ? `<p class="hint-text">${escapeHtml(t.hint)}</p>` : ''}
      ${t.link ? `<a class="hint-link" href="${escapeHtml(t.link)}" target="_blank" rel="noopener">🔗 ${escapeHtml(t.link)}</a>` : ''}
    </div>`).join('');
}

    return `<button type="button" class="wiz-btn ${isActive?'active':''}" data-tpl="${t.id}">${escapeHtml(t.title)}</button>`;
  }).join('');
}
function renderWizard(){
  document.getElementById('saleTypePre').classList.toggle('active', wizSaleType==='pre');
  document.getElementById('saleTypePost').classList.toggle('active', wizSaleType==='post');

  // Step 1: 開頭(依售前/售後篩選;沒設定售前售後的自訂話術一律歸類為售後)

  ).join('') + `<button type="button" class="wiz-chip" id="btnManageCats">⚙️ 管理類型</button>`;

function renderWizardBodySub(){
  const subWrap = document.getElementById('wizBodySub');

  if(!wizActiveCat){ subWrap.innerHTML=''; subLabel.style.display='none'; return; }

  });

/* ============ Rendering: list ============ */
function filteredTemplates(){
  return templates.filter(t=>{
    if(activeStage!=='all' && t.stage!==activeStage) return false;
    if(activeStage!=='wait' && activeStage!=='open' && activeStage!=='close' && activeCategory!=='all' && t.category!==activeCategory) return false;
    if(searchTerm){
      const hay = (t.title+' '+t.content+' '+(t.variants||[]).join(' ')).toLowerCase();
      if(!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  });
}
function renderList(){
  const list = filteredTemplates();
  const wrap = document.getElementById('listScroll');
  if(!list.length){
    wrap.innerHTML = `<div class="empty-hint">${icon('chat')}<br>找不到符合的話術<br>試試其他分類或關鍵字</div>`;
    return;

  wrap.innerHTML = list.map(t=>{

    if(t.category) badges.push(`<span class="badge badge-cat">${catLabel(t.category)}</span>`);
    if(t.variants && t.variants.length) badges.push(`<span class="badge badge-cat">🔀 ${t.variants.length+1} 個版本</span>`);

        </div>
      </div>
      <p class="tpl-title">${escapeHtml(t.title)} ${linkTag(t)}</p>

      </div>

  }).join('');

  wrap.querySelectorAll('.tpl-card').forEach(card=>{

/* ============ Compose ============ */
function genInstId(){ return 'i'+Date.now()+Math.random().toString(36).slice(2,6); }
function insertTemplate(tplId){
  const t = templates.find(x=>x.id===tplId);
  if(!t) return;
  if(SINGLE_STAGES.has(t.stage)){
    composeList = composeList.filter(c=>{
      const ct = templates.find(x=>x.id===c.tplId);
      return !(ct && ct.stage===t.stage);
    });
  }
  let idx = composeList.length;
  for(let i=0;i<composeList.length;i++){
    const ct = templates.find(x=>x.id===composeList[i].tplId);
    if(ct && STAGE_ORDER[ct.stage] > STAGE_ORDER[t.stage]){ idx = i; break; }
  }
  composeList.splice(idx, 0, {instId:genInstId(), tplId, variantIndex:0});
  renderCompose();
  renderWizard();
  showToast('已加入回覆');
}
function removeInst(instId){ composeList = composeList.filter(c=>c.instId!==instId); renderCompose(); renderWizard(); }
function moveInst(instId, dir){
  const idx = composeList.findIndex(c=>c.instId===instId);
  const newIdx = idx+dir;
  if(newIdx<0 || newIdx>=composeList.length) return;
  [composeList[idx], composeList[newIdx]] = [composeList[newIdx], composeList[idx]];
  renderCompose();
}
function cycleVariant(instId){
  const c = composeList.find(x=>x.instId===instId);
  if(!c) return;
  const t = templates.find(x=>x.id===c.tplId);
  if(!t) return;
  const arr = allVariants(t);
  c.variantIndex = (c.variantIndex + 1) % arr.length;
  renderBubblesOnly();
}
function currentVars(){
  const all = [];
  composeList.forEach(c=>{
    const t = templates.find(x=>x.id===c.tplId);
    if(t) extractVars(instanceText(t, c.variantIndex||0)).forEach(v=>{ if(!all.includes(v)) all.push(v); });
  });
  return all;
}

function renderVarBar(){
  const vars = currentVars();
  const bar = document.getElementById('varBar');
  if(!vars.length){ bar.classList.add('is-empty'); bar.innerHTML=''; return; }
  bar.classList.remove('is-empty');
  bar.innerHTML = `<span class="var-bar-label">填入變數</span>` + vars.map(v=>`
    <div class="var-field">
      <label>${escapeHtml(v)}</label>
      <input type="text" data-var="${escapeHtml(v)}" value="${escapeHtml(varsValues[v]||'')}" placeholder="輸入內容">
    </div>`).join('');
  bar.querySelectorAll('input').forEach(inp=>{
    inp.oninput = ()=>{ varsValues[inp.dataset.var] = inp.value; syncVarInputs(); };
  });
}
function syncVarInputs(){
  document.querySelectorAll('[data-var]').forEach(inp=>{
    const v = varsValues[inp.dataset.var] || '';
    if(inp.value !== v) inp.value = v;
  });
  renderBubblesOnly();
}
function renderCompose(){
  renderVarBar();
  renderActionHints();
  const area = document.getElementById('composeArea');
  const actions = document.getElementById('composeActions');
  if(!composeList.length){
    area.innerHTML = `<div class="compose-empty">${icon('chat')}<p>從左側點選「加入回覆」<br>開始組合給客人的訊息</p></div>`;
    actions.style.display='none';
    return;
  }
  actions.style.display='flex';
  area.innerHTML = composeList.map(c=>{
    const t = templates.find(x=>x.id===c.tplId);
    if(!t) return '';
    const variants = allVariants(t);
    const vi = c.variantIndex || 0;
    return `
    <div class="bubble-row" data-inst="${c.instId}">
      <div class="avatar">${icon('store')}</div>
      <div class="bubble-col">
        <div class="bubble-meta">
          <span class="bubble-name">小幫手</span>
          <span class="bubble-stage-tag">${STAGE_LABEL_SHORT[t.stage]}${t.category? ' · '+catLabel(t.category):''}${variants.length>1? ` · 版本 ${vi+1}/${variants.length}`:''}</span>
        </div>
        <div class="bubble-box" data-content>${fillHtml(instanceText(t, vi))}</div>
        <div class="bubble-toolbar">
          <button data-act="up">${icon('up')}上移</button>
          <button data-act="down">${icon('down')}下移</button>
          ${variants.length>1 ? `<button data-act="swap">🔀 換個說法</button>` : ''}
          <button data-act="copy">${icon('copy')}複製這段</button>
          <button data-act="del" class="danger">${icon('x')}移除</button>
        </div>
      </div>
    </div>`;
  }).join('');

  area.querySelectorAll('.bubble-row').forEach(row=>{
    const instId = row.dataset.inst;
    row.querySelector('[data-act=up]').onclick = ()=> moveInst(instId,-1);
    row.querySelector('[data-act=down]').onclick = ()=> moveInst(instId,1);
    row.querySelector('[data-act=del]').onclick = ()=> removeInst(instId);
    const swapBtn = row.querySelector('[data-act=swap]');
    if(swapBtn) swapBtn.onclick = ()=> cycleVariant(instId);
    row.querySelector('[data-act=copy]').onclick = async ()=>{
      const c = composeList.find(x=>x.instId===instId);
      const t = templates.find(x=>x.id===c.tplId);
      const text = instanceText(t, c.variantIndex||0);
      const plain = fillPlain(text);
      const hasEmpty = extractVars(text).some(v=>!(varsValues[v]&&varsValues[v].trim()));
      const ok = await copyText(plain);
      if(ok) showToast(hasEmpty ? '已複製,但還有變數未填喔' : '已複製這段', hasEmpty);
      else showToast('複製失敗,請手動選取', true);
    };
  });
}
function renderBubblesOnly(){
  document.querySelectorAll('.bubble-row').forEach(row=>{
    const instId = row.dataset.inst;
    const c = composeList.find(x=>x.instId===instId);
    const t = templates.find(x=>x.id===c.tplId);
    row.querySelector('[data-content]').innerHTML = fillHtml(instanceText(t, c.variantIndex||0));
    const variants = allVariants(t);
    const tag = row.querySelector('.bubble-stage-tag');
    if(tag) tag.textContent = `${STAGE_LABEL_SHORT[t.stage]}${t.category? ' · '+catLabel(t.category):''}${variants.length>1? ` · 版本 ${(c.variantIndex||0)+1}/${variants.length}`:''}`;
  });
}

            <label>售前/售後</label>
            <select id="mSaleType">
              <option value="pre" ${t.saleType==='pre'?'selected':''}>售前諮詢</option>
              <option value="post" ${t.saleType==='post'?'selected':''}>售後處理</option>
              <option value="both" ${(!t.saleType || t.saleType==='both')?'selected':''}>皆可適用</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>標題</label>
          <input type="text" id="mTitle" value="${escapeHtml(t.title||'')}" placeholder="例如:包裹物流查詢中">
        </div>
        <div class="field">
          <label>回覆內容</label>
          <textarea id="mContent" placeholder="輸入話術內容…">${escapeHtml(t.content||'')}</textarea>
          <p class="field-hint">用 {變數名稱} 標記需要填空的地方,例如 {客人名字}、{訂單編號},複製前會出現輸入框讓你填寫。</p>
        </div>
        <div class="field">
          <label>其他回覆方式(選填,同一個小項目的不同講法)</label>
          <div id="mVariantList" style="display:flex;flex-direction:column;gap:8px;"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="mAddVariant" style="margin-top:8px;">${icon('plus',' style="width:12px;height:12px"')} 新增一個說法</button>
          <p class="field-hint">加入回覆時可以用「🔀 換個說法」在這些版本之間切換。</p>
        </div>
        <div class="field">
          <label>建議動作提示(選填)</label>
          <input type="text" id="mHint" value="${escapeHtml(t.hint||'')}" placeholder="例如:退貨申請入口在訂單頁面→申請退貨/退款">
          <p class="field-hint">選這則話術加入回覆時,這段提示會顯示在左側「💡 建議動作」區塊,提醒你或客人該去哪裡操作。</p>
        </div>
        <div class="field">
          <label>參考連結(選填)</label>
          <input type="text" id="mLink" value="${escapeHtml(t.link||'')}" placeholder="說明中心文章或功能頁的網址">
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="mCancel">取消</button>
        <button class="btn btn-primary" id="mSave">${icon('check',' style="stroke:#fff;width:13px;height:13px"')} 儲存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const stageSel = overlay.querySelector('#mStage');
  const catWrap = overlay.querySelector('#mCatWrap');
  const saleWrap = overlay.querySelector('#mSaleWrap');
  stageSel.onchange = ()=>{
    catWrap.style.display = stageSel.value==='body' ? 'block':'none';
    saleWrap.style.display = (stageSel.value==='open'||stageSel.value==='close'||stageSel.value==='body') ? 'block':'none';
  };

  let variantDrafts = (t.variants || []).slice();
  function renderVariantList(){
    const wrap = overlay.querySelector('#mVariantList');
    if(!variantDrafts.length){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = variantDrafts.map((v,i)=>`
      <div style="display:flex;gap:6px;align-items:flex-start;">
        <textarea class="mVariantInput" data-idx="${i}" style="flex:1;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6;outline:none;">${escapeHtml(v)}</textarea>
        <button type="button" class="icon-btn" data-rmv="${i}" title="刪除這個版本">${icon('trash')}</button>
      </div>`).join('');
    wrap.querySelectorAll('[data-rmv]').forEach(btn=>{
      btn.onclick = ()=>{
        overlay.querySelectorAll('.mVariantInput').forEach(ta=>{ variantDrafts[Number(ta.dataset.idx)] = ta.value; });
        variantDrafts.splice(Number(btn.dataset.rmv), 1);
        renderVariantList();
      };
    });
  }
  renderVariantList();
  overlay.querySelector('#mAddVariant').onclick = ()=>{
    overlay.querySelectorAll('.mVariantInput').forEach(ta=>{ variantDrafts[Number(ta.dataset.idx)] = ta.value; });
    variantDrafts.push('');
    renderVariantList();
  };

  overlay.querySelector('#mClose').onclick = ()=>overlay.remove();
  overlay.querySelector('#mCancel').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  overlay.querySelector('#mSave').onclick = async ()=>{
    const stage = overlay.querySelector('#mStage').value;
    const category = stage==='body' ? overlay.querySelector('#mCategory').value : null;
    const saleType = (stage==='open'||stage==='close'||stage==='body') ? overlay.querySelector('#mSaleType').value : null;
    const title = overlay.querySelector('#mTitle').value.trim();
    const content = overlay.querySelector('#mContent').value.trim();
    overlay.querySelectorAll('.mVariantInput').forEach(ta=>{ variantDrafts[Number(ta.dataset.idx)] = ta.value; });
    const variants = variantDrafts.map(v=>v.trim()).filter(Boolean);
    const hint = overlay.querySelector('#mHint').value.trim() || undefined;
    const link = overlay.querySelector('#mLink').value.trim() || undefined;
    if(!title || !content){ showToast('請填寫標題與內容', true); return; }
    if(id){
      const idx = templates.findIndex(x=>x.id===id);
      templates[idx] = {...templates[idx], stage, category, saleType, title, content, variants, hint, link};
    }else{
      templates.unshift({id:'u'+Date.now(), stage, category, saleType, title, content, variants, hint, link});
    }
    await saveTemplates(templates);
    overlay.remove();
    renderAll();
    renderCompose();
    showToast(id?'已更新話術':'已新增話術');
  };
}
function deleteTemplate(id){
  customConfirm('確定要刪除這則話術嗎?', () => {
    templates = templates.filter(t=>t.id!==id);
    saveTemplates(templates);
    renderAll();
    renderCompose();
    showToast('已刪除');
  });
}

/* ============ Category management (問題大類型) ============ */
function openCategoryModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>管理問題類型</h3><button class="icon-btn" id="ctClose">${icon('x')}</button></div>
      <div class="modal-body">
        <div id="ctList" style="display:flex;flex-direction:column;gap:8px;"></div>
        <div class="field-row" style="margin-top:6px;">
          <div class="field" style="flex:0 0 64px;">
            <label>圖示</label>
            <input type="text" id="ctEmoji" value="🏷️" maxlength="4">
          </div>
          <div class="field">
            <label>新增類型名稱</label>
            <input type="text" id="ctNewLabel" placeholder="例如:發票/收據">
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" id="ctAdd" style="align-self:flex-start;">${icon('plus',' style="width:13px;height:13px"')} 新增類型</button>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" id="ctDone">完成</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function renderCtList(){
    const listEl = overlay.querySelector('#ctList');
    listEl.innerHTML = categories.map(c=>{
      const count = templates.filter(t=>t.stage==='body' && t.category===c.id).length;
      return `
      <div style="display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;">
        <span style="font-size:15px;">${c.emoji}</span>
        <span style="flex:1;font-size:13px;font-weight:700;">${escapeHtml(c.label)}</span>
        <span style="font-size:11px;color:var(--ink-faint);">${count} 則話術</span>
        <button type="button" class="icon-btn" data-up="${c.id}" title="上移">${icon('up')}</button>
        <button type="button" class="icon-btn" data-down="${c.id}" title="下移">${icon('down')}</button>
        <button type="button" class="icon-btn" data-del="${c.id}" title="刪除">${icon('trash')}</button>
      </div>`;
    }).join('');
    listEl.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = ()=> deleteCategory(btn.dataset.del, renderCtList);
    });
    listEl.querySelectorAll('[data-up]').forEach(btn=>{
      btn.onclick = ()=> moveCategory(btn.dataset.up, -1, renderCtList);
    });
    listEl.querySelectorAll('[data-down]').forEach(btn=>{
      btn.onclick = ()=> moveCategory(btn.dataset.down, 1, renderCtList);
    });
  }
  renderCtList();

  overlay.querySelector('#ctAdd').onclick = ()=>{
    const label = overlay.querySelector('#ctNewLabel').value.trim();
    const emoji = overlay.querySelector('#ctEmoji').value.trim() || '🏷️';
    if(!label){ showToast('請輸入類型名稱', true); return; }
    if(categories.some(c=>c.label===label)){ showToast('已經有這個類型了', true); return; }
    categories = [...categories, {id:'c'+Date.now()+Math.random().toString(36).slice(2,5), label, emoji}];
    saveCategories(categories);
    overlay.querySelector('#ctNewLabel').value = '';
    renderCtList();
    renderAll();
    showToast('已新增類型');
  };
  overlay.querySelector('#ctClose').onclick = ()=>{ overlay.remove(); renderAll(); };
  overlay.querySelector('#ctDone').onclick = ()=>{ overlay.remove(); renderAll(); };
  overlay.onclick = (e)=>{ if(e.target===overlay){ overlay.remove(); renderAll(); } };
}
function moveCategory(catId, dir, after){
  const idx = categories.findIndex(c=>c.id===catId);
  const newIdx = idx + dir;
  if(idx<0 || newIdx<0 || newIdx>=categories.length) return;
  categories = categories.slice();
  [categories[idx], categories[newIdx]] = [categories[newIdx], categories[idx]];
  saveCategories(categories);
  if(after) after();
  renderAll();
}
function deleteCategory(catId, afterDelete){
  if(categories.length<=1){ showToast('至少要保留一個問題類型', true); return; }
  const cat = categories.find(c=>c.id===catId);
  if(!cat) return;
  const affected = templates.filter(t=>t.stage==='body' && t.category===catId).length;
  const msg = affected
    ? `刪除「${cat.label}」會把底下 ${affected} 則中段話術移到其他類型,要繼續嗎?`
    : `確定要刪除「${cat.label}」這個類型嗎?`;
  
  customConfirm(msg, () => {
    categories = categories.filter(c=>c.id!==catId);
    const fallback = categories.find(c=>c.label==='其他') || categories[0];
    templates.forEach(t=>{ if(t.stage==='body' && t.category===catId) t.category = fallback.id; });
    saveCategories(categories);
    saveTemplates(templates);
    if(wizActiveCat===catId) wizActiveCat = null;
    if(activeCategory===catId) activeCategory = 'all';
    if(afterDelete) afterDelete();
    renderAll();
    renderCompose();
    showToast('已刪除類型');
  });
}

/* ============ Logistics calculator modal ============ */
function openCalcModal(){
  calcSelection = null;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:560px;">
      <div class="modal-head">
        <h3>🚚 物流到貨試算</h3>
        <button class="icon-btn" id="cClose">${icon('x')}</button>
      </div>
      <div class="modal-body">
        <p class="field-hint" style="margin:-6px 0 2px;">依蝦皮官方時效表整理,選一個符合的方案與時間,就能自動算出「物流狀態」與「天數」。</p>
        <div class="calc-plans">
          ${LOGISTICS_RULES.map(plan=>`
            <div class="calc-plan" style="--plan-color:${plan.color}">
              <div class="calc-plan-head">${plan.label}</div>
              <div class="calc-plan-rows">
                ${plan.rows.map((row,ri)=>`
                  <button type="button" class="calc-row" data-plan="${plan.id}" data-row="${ri}">
                    <span>${row.label}</span>
                    <span class="calc-result">→ ${row.result}</span>
                  </button>`).join('')}
              </div>
              <div class="calc-plan-area">${plan.area}</div>
            </div>`).join('')}
        </div>
        <div class="field calc-date-field">
          <label>訂單完成日期(選填,填了會自動推算實際到貨日)</label>
          <input type="date" id="calcDate">
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="cCancel">取消</button>
        <button class="btn btn-primary" id="cApply">${icon('check',' style="stroke:#fff;width:13px;height:13px"')} 帶入變數</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('.calc-row').forEach(btn=>{
    btn.onclick = ()=>{
      overlay.querySelectorAll('.calc-row').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      calcSelection = {planId:btn.dataset.plan, rowIdx:Number(btn.dataset.row)};
    };
  });
  overlay.querySelector('#cClose').onclick = ()=>overlay.remove();
  overlay.querySelector('#cCancel').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  overlay.querySelector('#cApply').onclick = ()=>{
    if(!calcSelection){ showToast('請先選一個物流方案', true); return; }
    const plan = LOGISTICS_RULES.find(p=>p.id===calcSelection.planId);
    const row = plan.rows[calcSelection.rowIdx];
    const dateVal = overlay.querySelector('#calcDate').value;

    let statusText = row.result;
    if(dateVal && row.days!==null){
      const d = new Date(dateVal+'T00:00:00');
      d.setDate(d.getDate()+row.days);
      const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
      statusText = `${row.result}(預估 ${dateStr} 送達)`;
    }
    varsValues['物流狀態'] = statusText;
    if(row.days!==null) varsValues['天數'] = String(row.days);

    syncVarInputs();
    overlay.remove();
    showToast('已帶入物流狀態' + (row.days!==null ? '與天數' : ''));
  };
}

/* ============ Boot ============ */
function renderAll(){
  renderWizard();
  renderStageChips();
  renderCategoryChips();
  renderList();
  document.getElementById('statCount').textContent = templates.length;
}
async function boot(){
  categories = await loadCategories();
  templates = await loadTemplates();
  renderAll();
  renderCompose();
  setSidebarMode('wizard');
  document.querySelectorAll('.mode-tab').forEach(b=>{ b.onclick = ()=> setSidebarMode(b.dataset.mode); });
  document.getElementById('saleTypePre').onclick = ()=>{ wizSaleType='pre'; renderWizard(); };
  document.getElementById('saleTypePost').onclick = ()=>{ wizSaleType='post'; renderWizard(); };

  document.getElementById('searchInput').oninput = (e)=>{ searchTerm = e.target.value; renderList(); };
  document.getElementById('btnExport').onclick = exportCurrentTemplates;
  document.getElementById('btnImport').onclick = ()=> document.getElementById('fileImport').click();
  document.getElementById('fileImport').onchange = async (e)=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    if(typeof XLSX==='undefined'){ showToast('匯入功能載入失敗,請檢查網路連線後重新整理', true); return; }
    try{
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(!rows.length){ showToast('這個檔案裡沒有讀到資料', true); return; }
      const result = importFromRows(rows);
      if(result.error){ showToast(result.error, true); return; }
      if(!result.valid.length){ showToast('沒有偵測到可匯入的話術,請確認欄位內容', true); return; }
      openImportConfirmModal(result, file.name);
    }catch(err){
      console.error(err);
      showToast('讀取檔案失敗,請確認是否為 Excel 或 CSV 格式', true);
    }
  };
  document.getElementById('qOrderNo').oninput = (e)=>{ varsValues['訂單編號'] = e.target.value; syncVarInputs(); };
  document.getElementById('btnCalc').onclick = openCalcModal;
  document.getElementById('btnAdd').onclick = ()=> openModal(null);
  document.getElementById('btnClear').onclick = ()=>{ composeList=[]; varsValues={}; renderCompose(); renderWizard(); };
  document.getElementById('btnReset').onclick = async ()=>{
    customConfirm('將會清除所有自訂話術與問題類型,還原成預設的內容,確定嗎?', async () => {
      templates = SEED_TEMPLATES.slice();
      categories = SEED_CATEGORIES.slice();
      await saveTemplates(templates);
      await saveCategories(categories);
      wizActiveCat = null; activeCategory = 'all';
      renderAll();
      renderCompose();
      showToast('已重置為預設話術');
    });
  };
  
  // 補齊結尾截斷的複製全部邏輯
  document.getElementById('btnCopyAll').onclick = async ()=>{
    if(!composeList.length) return;
    
    // 組合所有文字
    const parts = composeList.map(c => {
      const t = templates.find(x => x.id === c.tplId);
      if(!t) return '';
      const text = instanceText(t, c.variantIndex || 0);
      return fillPlain(text);
    }).filter(p => p !== '');
    
    const finalText = parts.join('\n\n'); // 使用換行分隔每一段回覆
    
    // 檢查是否有未填寫的變數
    const hasEmpty = currentVars().some(v => !(varsValues[v] && varsValues[v].trim()));
    
    // 執行複製
    const ok = await copyText(finalText);
    if(ok) {
      showToast(hasEmpty ? '已複製全部，但還有變數未填喔！' : '已複製全部回覆！', hasEmpty);
    } else {
      showToast('複製失敗，請手動選取', true);
    }
  };
}

// 啟動應用程式
boot();
</script>
</body>
</html>
