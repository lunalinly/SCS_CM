<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小幫手話術台｜客服快速回覆工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="templateQuickStart" style="display:flex;align-items:center;gap:14px;padding:12px 24px;background:#fff7ed;border-bottom:1px solid #fed7aa;color:#9a3412;font-size:13px;line-height:1.5;">
  <strong style="font-size:14px;">📋 快速開始：建立你自己的話術台</strong>
  <span style="flex:1;">在 GitHub 按「Use this template」→ 建立自己的倉庫 → 到 Settings → Pages 發布網站。</span>
  <a href="quick-start.html" target="_blank" rel="noopener" style="color:#c2410c;font-weight:700;text-decoration:underline;white-space:nowrap;">查看完整設定步驟</a>
  <button type="button" id="btnCloseQuickStart" aria-label="關閉快速開始提示" title="關閉" style="border:none;background:transparent;color:#9a3412;font-size:20px;line-height:1;padding:2px 5px;cursor:pointer;">×</button>
</section>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 8l8-5 8 5M4 8v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M4 8l2 12M20 8l-2 12M9 12a3 3 0 0 0 6 0"/></svg>
    </div>
    <div class="brand-text">
      <h1>小幫手話術台</h1>
      <p>客服快速回覆組合工具</p>
    </div>
  </div>

  <div class="header-search">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="搜尋話術標題或內文…">
  </div>

  <div class="save-badge" id="saveBadge" title="話術皆自動儲存於目前瀏覽器，更新網頁不遺失">
    <span class="save-dot"></span>已於本機保存
  </div>

  <div class="header-stat">共 <b id="statCount">0</b> 則話術</div>
  
  <button class="btn btn-ghost" id="btnExport" title="匯出 Excel 或 JSON 備份檔">
    <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    匯出備份
  </button>
  <button class="btn btn-ghost" id="btnTemplate" title="下載 Excel 空白模板">
    <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    下載模板
  </button>
  <button class="btn btn-ghost" id="btnImport" title="匯入 Excel 或 JSON 備份檔">
    <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    匯入檔案
  </button>
  <input type="file" id="fileImport" accept=".xlsx,.xls,.csv,.json" style="display:none;">

  <button class="btn btn-primary" id="btnAdd">
    <svg class="icon" viewBox="0 0 24 24" style="stroke:#fff;width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg>
    新增話術
  </button>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="wizard">
        <svg class="icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        組合精靈
      </button>
      <button class="mode-tab" data-mode="browse">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        瀏覽全部話術
      </button>
    </div>

    <!-- 組合精靈面板 -->
    <div class="mode-panel" id="wizardPanel">
      <div class="wiz-step" style="border-bottom:1px solid var(--line);background:var(--surface-alt);">
        <div class="wiz-step-head">這通是售前還是售後?</div>
        <div class="wiz-btns">
          <button type="button" class="wiz-chip" id="saleTypePre">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
            售前諮詢
          </button>
          <button type="button" class="wiz-chip" id="saleTypePost">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            售後處理
          </button>
        </div>
      </div>
      <div class="wiz-step" id="wizStepOpen">
        <div class="wiz-step-head wiz-collapsible" data-collapse-step="wizStepOpen" role="button" tabindex="0" aria-expanded="true"><span><span class="step-num">1</span>開頭</span><span class="wiz-toggle" aria-hidden="true">▽</span></div>
        <p class="wiz-sub-label" id="wizOpenTagLabel" style="display:none;">篩選標籤</p>
        <div class="wiz-btns" id="wizOpenTagFilters"></div>
        <p class="wiz-sub-label">選擇問題</p>
        <div class="wiz-btns" id="wizOpen"></div>
        <p class="wiz-sub-label" id="wizOpenDetailLabel" style="display:none;">細項</p>
        <div class="wiz-btns" id="wizOpenDetails"></div>
      </div>
      <div class="wiz-step" id="wizStepBody">
        <div class="wiz-step-head wiz-collapsible" data-collapse-step="wizStepBody" role="button" tabindex="0" aria-expanded="true"><span><span class="step-num">2</span>中段回答</span><span class="wiz-toggle" aria-hidden="true">▽</span></div>
        <p class="wiz-sub-label">先選分類</p>
        <div class="wiz-btns" id="wizBodyCat"></div>
        <p class="wiz-sub-label" id="wizProblemTagLabel" style="display:none;">篩選標籤</p>
        <div class="wiz-btns" id="wizProblemTagFilters"></div>
        <p class="wiz-sub-label" id="wizSubcategoryLabel" style="display:none;">選擇問題</p>
        <div class="wiz-btns" id="wizSubcategory"></div>
        <p class="wiz-sub-label" id="wizBodySubLabel" style="display:none;">細項</p>
        <div class="wiz-btns" id="wizBodySub"></div>
      </div>
      <div class="wiz-step" id="wizStepWait">
        <div class="wiz-step-head wiz-collapsible" data-collapse-step="wizStepWait" role="button" tabindex="0" aria-expanded="true"><span><span class="step-num">3</span>需要花時間查詢<span class="step-optional">選用</span></span><span class="wiz-toggle" aria-hidden="true">▽</span></div>
        <p class="wiz-sub-label" id="wizWaitTagLabel" style="display:none;">篩選標籤</p>
        <div class="wiz-btns" id="wizWaitTagFilters"></div>
        <p class="wiz-sub-label">選擇問題</p>
        <div class="wiz-btns" id="wizWait"></div>
        <p class="wiz-sub-label" id="wizWaitDetailLabel" style="display:none;">細項</p>
        <div class="wiz-btns" id="wizWaitDetails"></div>
      </div>
      <div class="wiz-step" id="wizStepClose">
        <div class="wiz-step-head wiz-collapsible" data-collapse-step="wizStepClose" role="button" tabindex="0" aria-expanded="true"><span><span class="step-num">4</span>結尾</span><span class="wiz-toggle" aria-hidden="true">▽</span></div>
        <p class="wiz-sub-label" id="wizCloseTagLabel" style="display:none;">篩選標籤</p>
        <div class="wiz-btns" id="wizCloseTagFilters"></div>
        <p class="wiz-sub-label">選擇問題</p>
        <div class="wiz-btns" id="wizClose"></div>
        <p class="wiz-sub-label" id="wizCloseDetailLabel" style="display:none;">細項</p>
        <div class="wiz-btns" id="wizCloseDetails"></div>
      </div>
    </div>

    <!-- 瀏覽全部面板 -->
    <div class="mode-panel" id="browsePanel" style="display:none;">
      <div class="filter-block">
        <p class="filter-label">依對話階段</p>
        <div class="chip-row" id="stageChips"></div>
        <div class="sub-filters" id="categoryWrap" style="display:none;">
          <p class="filter-label">依大類型</p>
          <div class="chip-row" id="categoryChips"></div>
        </div>
      </div>
      <div class="list-scroll" id="listScroll"></div>
    </div>

    <div class="sidebar-footer">
      <span style="font-size:11px;color:var(--ink-faint);" id="sidebarHint">點按鈕就會依順序組進右邊的回覆</span>
      <button class="link-btn" id="btnReset">
        <svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        重置預設話術
      </button>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <main class="main">
    <div class="quickbar">
      <button class="btn btn-ghost btn-sm" id="btnManageVars">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        管理現有參數
      </button>
      <div style="flex:1;"></div>
      <button class="btn btn-ghost btn-sm" id="btnBackupModal">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        全站 JSON 備份/還原
      </button>
    </div>

    <div class="var-bar is-empty" id="varBar"></div>
    <div class="compose-scroll">
      <div class="compose-inner">
        <div id="composeArea"></div>
        <div class="compose-actions" id="composeActions" style="display:none;">
          <button class="btn btn-ghost" id="btnClear">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
            清空重來
          </button>
          <button class="btn btn-primary" id="btnCopyAll">
            <svg class="icon" viewBox="0 0 24 24" style="stroke:#fff"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            複製全部回覆
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 操作提示：有內容時顯示於最右側 -->  
  <aside class="hint-sidebar" style="display:none;">
    <div class="action-hints" id="actionHints" style="display:none;"></div>
  </aside>
</div>

<div id="toast-wrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
